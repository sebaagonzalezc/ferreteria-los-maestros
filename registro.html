  <link href="css/vendor/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"

  <!-- ==================== CONTENIDO ==================== -->
  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-4">Registro de usuario</h1>

            <form id="form-registro" novalidate>
              <div class="row g-3">

                <div class="col-md-6">
                  <label for="reg-run" class="form-label">RUN <span class="text-danger">*</span></label>
                  <input type="text" id="reg-run" class="form-control" placeholder="Ej: 123456785 (sin puntos ni guion)">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-md-6">
                  <label for="reg-nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                  <input type="text" id="reg-nombre" class="form-control" maxlength="50">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-md-6">
                  <label for="reg-apellidos" class="form-label">Apellidos <span class="text-danger">*</span></label>
                  <input type="text" id="reg-apellidos" class="form-control" maxlength="100">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-md-6">
                  <label for="reg-correo" class="form-label">Correo <span class="text-danger">*</span></label>
                  <input type="email" id="reg-correo" class="form-control" placeholder="tucorreo@gmail.com">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-md-6">
                  <label for="reg-password" class="form-label">Contraseña <span class="text-danger">*</span></label>
                  <input type="password" id="reg-password" class="form-control" placeholder="Entre 4 y 10 caracteres">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-md-6">
                  <label for="reg-password2" class="form-label">Confirmar contraseña <span class="text-danger">*</span></label>
                  <input type="password" id="reg-password2" class="form-control">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-md-6">
                  <label for="reg-region" class="form-label">Región <span class="text-danger">*</span></label>
                  <select id="reg-region" class="form-select"></select>
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-md-6">
                  <label for="reg-comuna" class="form-label">Comuna <span class="text-danger">*</span></label>
                  <select id="reg-comuna" class="form-select"></select>
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-12">
                  <label for="reg-direccion" class="form-label">Dirección <span class="text-danger">*</span></label>
                  <input type="text" id="reg-direccion" class="form-control" maxlength="300">
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-12">
                  <label for="reg-fecha" class="form-label">Fecha de nacimiento (opcional)</label>
                  <input type="date" id="reg-fecha" class="form-control">
                </div>

              </div>

              <button type="submit" class="btn btn-marca mt-4 w-100">Registrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->

  <script src="js/comun.js"></script>
</body>
