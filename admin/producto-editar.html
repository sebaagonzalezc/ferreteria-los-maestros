<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Editar producto</title>
  <link href="../css/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="../css/vendor/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head>
<body class="admin">

  <div class="admin-layout">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar">
      <div class="marca"><i class="bi bi-hammer"></i> Los Maestros</div>
      <nav class="nav flex-column">
        <div class="seccion-titulo">General</div>
        <a class="nav-link" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <div class="seccion-titulo">Gestión</div>
        <a class="nav-link" href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
        <a class="nav-link solo-admin" href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a>
      </nav>
      <div class="pie-sidebar">
        <div><i class="bi bi-person-circle"></i> <span id="nombre-admin">—</span></div>
        <small class="text-capitalize text-muted" id="rol-admin"></small>
        <button class="btn btn-sm btn-outline-light w-100 mt-2" id="btn-salir-admin">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- ==================== CONTENIDO ==================== -->
    <div class="admin-contenido">
      <div class="admin-topbar">
        <button class="btn btn-dark btn-menu-movil" id="btn-menu-movil"><i class="bi bi-list"></i></button>
        <h1>Editar producto</h1>
        <a href="productos.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <!-- Mismo formulario que "editar"; lo maneja validaciones.js -->
          <form id="form-producto" novalidate>
            <div class="row g-3">

              <div class="col-md-4">
                <label for="prod-codigo" class="form-label">Código <span class="text-danger">*</span></label>
                <input type="text" id="prod-codigo" class="form-control" placeholder="Ej: MC011 (mín. 3 caracteres)">
                <div class="invalid-feedback"></div>
              </div>

              <div class="col-md-8">
                <label for="prod-nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" id="prod-nombre" class="form-control" maxlength="100">
                <div class="invalid-feedback"></div>
              </div>

              <div class="col-12">
                <label for="prod-descripcion" class="form-label">Descripción (opcional)</label>
                <textarea id="prod-descripcion" class="form-control" rows="2" maxlength="500"></textarea>
                <div class="invalid-feedback"></div>
              </div>

              <div class="col-md-4">
                <label for="prod-precio" class="form-label">Precio <span class="text-danger">*</span></label>
                <input type="number" id="prod-precio" class="form-control" min="0" step="0.01" placeholder="0 = producto gratis">
                <div class="invalid-feedback"></div>
              </div>

              <div class="col-md-4">
                <label for="prod-stock" class="form-label">Stock <span class="text-danger">*</span></label>
                <input type="number" id="prod-stock" class="form-control" min="0" step="1">
                <div class="invalid-feedback"></div>
              </div>

              <div class="col-md-4">
                <label for="prod-stock-critico" class="form-label">Stock crítico (opcional)</label>
                <input type="number" id="prod-stock-critico" class="form-control" min="0" step="1">
                <div class="invalid-feedback"></div>
              </div>

              <div class="col-md-6">
                <label for="prod-categoria" class="form-label">Categoría <span class="text-danger">*</span></label>
                <!-- validaciones.js llena las opciones -->
                <select id="prod-categoria" class="form-select">
                  <option value="">-- Seleccione una categoría --</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>

              <div class="col-md-6">
                <label for="prod-imagen" class="form-label">Imagen (opcional)</label>
                <input type="file" id="prod-imagen" class="form-control" accept="image/*">
              </div>

            </div>

            <button type="submit" class="btn btn-marca mt-4" style="background:#e8590c;border-color:#e8590c;color:#fff;">
              <i class="bi bi-save"></i> Actualizar producto
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="../js/vendor/bootstrap.bundle.min.js"></script>
  <script src="../js/datos-productos.js"></script>
  <script src="../js/datos-usuarios.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
